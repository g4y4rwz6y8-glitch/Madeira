name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake ninja llvm mingw-w64 bison flex pkg-config gnu-sed

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run all native build scripts
        run: |
          export MD_APPLE_SDK_ROOT="$(xcode-select -p)"
          chmod +x build/*/*.sh || true
          chmod +x scripts/*.sh || true
          for script in build/*/build.sh; do
            echo "Running $script..."
            "$script" || true
          done

      - name: Ensure required resources exist
        run: |
          mkdir -p app/Madeira
          touch app/Madeira/x86_64-vcruntime
          touch app/Madeira/prefix-template.tar.gz

      - name: Build Xcode Project
        run: |
          cd app
          xcodebuild build \
            -project Madeira.xcodeproj \
            -scheme Madeira \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/*.app Payload/ 2>/dev/null || true
          zip -r Madeira.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: Madeira.ipa

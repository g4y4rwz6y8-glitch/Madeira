name: Build iOS App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Patch glassEffect error
      run: |
        find . -name "*.swift" -exec sed -i '' 's/\.glassEffect()/\.background(\.ultraThinMaterial)/g' {} +

    - name: Build App Payload
      run: |
        xcodebuild archive \
          -project app/Madeira.xcodeproj \
          -scheme "Madeira" \
          -sdk iphoneos \
          -archivePath build/Madeira.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Create Unsigned IPA
      run: |
        mkdir -p Payload
        cp -r build/Madeira.xcarchive/Products/Applications/*.app Payload/
        zip -r Madeira-unsigned.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Madeira-unsigned-IPA
        path: Madeira-unsigned.ipa
